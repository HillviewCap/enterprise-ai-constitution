<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1049.986 819.094" width="1200" height="820" xmlns:bx="https://boxy-svg.com">
  <defs>
    <radialGradient id="gOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.01"/>
    </radialGradient>
    <radialGradient id="gMiddle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="gInner" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#64c9cf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#64c9cf" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="glowT">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="aBlue" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3b82f6" opacity="0.5"/>
    </marker>
    <marker id="aPurple" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8b5cf6" opacity="0.6"/>
    </marker>
    <marker id="aTeal" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#64c9cf" opacity="0.7"/>
    </marker>
    <bx:export>
      <bx:file format="svg"/>
    </bx:export>
  </defs>
  <g style="" transform="matrix(0.875584, 0, 0, 1, 0.038071, 0)">
    <rect width="1200.31" height="820" fill="#0a0e17" x="0.306" style=""/>
    <g transform="matrix(1, 0, 0, 1, 15.318201, -1.56338)">
      <text x="448" y="678" font-family="monospace" font-size="15" font-weight="600" fill="#8b5cf6" style="white-space: pre;">02</text>
      <text x="476" y="678" font-family="monospace" font-size="10" fill="#64c9cf" letter-spacing="2" style="white-space: pre;">SECURITY MODEL</text>
      <text x="476" y="698" font-family="sans-serif" font-size="12" font-weight="600" fill="#c9d6e3" style="white-space: pre;">Micro-segmentation for AI judgment.</text>
      <text x="476" y="714" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">Context is scoped and bounded at the identity layer,</text>
      <text x="476" y="730" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">not the network layer. The AI doesn't guess at</text>
      <text x="476" y="746" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">relevance. It arrives as an organizational participant</text>
      <text x="476" y="762" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">that already knows where it is.</text>
    </g>
  </g>
  <text x="600" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#64c9cf" letter-spacing="3" style="white-space: pre;">LAYERED AI GOVERNANCE</text>
  <text x="509.542" y="76.673" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#f0f4f8" style="white-space: pre; font-size: 32px;">The Enterprise AI </text>
  <text x="740.617" y="76" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#64c9cf" style="white-space: pre; font-size: 32px;">Constitution</text>
  <text x="600" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a9bb0" style="white-space: pre;">Organizational identity embedded at deployment, so the AI arrives knowing where it is,</text>
  <text x="600" y="117" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a9bb0" style="white-space: pre;">who it works for, and what constraints apply before a single prompt is sent.</text>
  <g transform="translate(250, 370)">
    <circle cx="0" cy="0" r="210" fill="url(#gOuter)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="7 4" opacity="0.65"/>
    <circle cx="0" cy="0" r="142" fill="url(#gMiddle)" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.8"/>
    <circle cx="0" cy="0" r="76" fill="url(#gInner)" stroke="#64c9cf" stroke-width="2" opacity="0.9" filter="url(#glowT)"/>
    <circle cx="0" cy="0" r="36" fill="#0d1929" stroke="#64c9cf" stroke-width="1.5" filter="url(#glowT)"/>
    <text x="0" y="-4" text-anchor="middle" font-family="monospace" font-size="10" fill="#64c9cf" letter-spacing="1" style="white-space: pre;">AI</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="8" fill="#64c9cf" opacity="0.8" letter-spacing="0.5" style="white-space: pre;">AGENT</text>
    <text x="0" y="-192" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3b82f6" style="white-space: pre;">LAYER 1: CORPORATE CONSTITUTION</text>
    <text x="0" y="-176" text-anchor="middle" font-family="monospace" font-size="10" fill="#e2e8f0" style="white-space: pre;">Identity · Regulations · Data Tiers · Behavioral Rules</text>
    <text x="0" y="-124" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#8b5cf6" style="white-space: pre;">LAYER 2: TEAM / FUNCTION</text>
    <text x="0" y="-110" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#e2e8f0" style="white-space: pre;">Procedures · Risk Profile · Approved Tools</text>
    <text x="0" y="-58" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#64c9cf" style="white-space: pre;">LAYER 3: PRACTITIONER</text>
    <text x="0" y="-44" text-anchor="middle" font-family="monospace" font-size="9" fill="#e2e8f0" style="white-space: pre;">Role · Environment · Decision Authority</text>
    <line x1="206" y1="0" x2="178" y2="0" stroke="#3b82f6" stroke-width="1.4" opacity="0.5" marker-end="url(#aBlue)"/>
    <line x1="138" y1="0" x2="112" y2="0" stroke="#8b5cf6" stroke-width="1.4" opacity="0.6" marker-end="url(#aPurple)"/>
    <line x1="72" y1="0" x2="52" y2="0" stroke="#64c9cf" stroke-width="1.4" opacity="0.7" marker-end="url(#aTeal)"/>
    <text x="228" y="0" text-anchor="middle" font-family="monospace" font-size="9" fill="#e2e8f0" letter-spacing="1.5" transform="rotate(90,228,0)" style="white-space: pre;">CONTEXT NARROWS INWARD</text>
    <text x="0" y="232" text-anchor="middle" font-family="monospace" font-size="9" fill="#e2e8f0" letter-spacing="1" style="white-space: pre;">EACH LAYER INHERITS FROM AND IS CONSTRAINED BY THE LAYER ABOVE</text>
  </g>
  <rect x="530" y="165" width="495.767" height="120" rx="6" fill="rgba(255,255,255,0.03)" style=""/>
  <rect x="530" y="165" width="3" height="120" fill="#3b82f6"/>
  <text x="552" y="186" font-family="monospace" font-size="10" fill="#3b82f6" letter-spacing="2" style="white-space: pre;">LAYER 1: OUTERMOST</text>
  <text x="552" y="208" font-family="sans-serif" font-size="17" font-weight="700" fill="#f0f4f8" style="white-space: pre;">Corporate Constitution</text>
  <text x="552" y="228" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">Who the organization is, what it builds, who it serves, what regulations govern it,</text>
  <text x="552" y="244" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">and what behavioral rules are non-negotiable. Deployed at the system level as a</text>
  <text x="552" y="260" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">read-only, tamper-verified document. The AI arrives knowing it.</text>
  <rect x="552" y="268" width="96" height="18" rx="3" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="600" y="280" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd" style="white-space: pre;">System Prompt</text>
  <rect x="654" y="268" width="130" height="18" rx="3" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="719" y="280" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd" style="white-space: pre;">CISO / AI Governance</text>
  <rect x="790" y="268" width="70" height="18" rx="3" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="825" y="280" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd" style="white-space: pre;">Read-Only</text>
  <rect x="866" y="268" width="115" height="18" rx="3" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="923" y="280" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd" style="white-space: pre;">9-Section Standard</text>
  <rect x="530" y="305" width="495.627" height="120" rx="6" fill="rgba(255,255,255,0.03)" style=""/>
  <rect x="530" y="305" width="3" height="120" fill="#8b5cf6"/>
  <text x="552" y="326" font-family="monospace" font-size="10" fill="#8b5cf6" letter-spacing="2" style="white-space: pre;">LAYER 2: MIDDLE</text>
  <text x="552" y="348" font-family="sans-serif" font-size="17" font-weight="700" fill="#f0f4f8" style="white-space: pre;">Team / Function Context</text>
  <text x="552" y="368" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">How corporate principles are interpreted for a specific group: engineering, finance,</text>
  <text x="552" y="384" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">legal, operations, security. Risk profiles change. Permissible actions change.</text>
  <text x="552" y="400" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">Governed by team leads who can articulate what the role actually does.</text>
  <rect x="552" y="408" width="120" height="18" rx="3" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="612" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd" style="white-space: pre;">Manager Governed</text>
  <rect x="678" y="408" width="90" height="18" rx="3" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="723" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd" style="white-space: pre;">RBAC Aligned</text>
  <rect x="774" y="408" width="115" height="18" rx="3" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="831" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd" style="white-space: pre;">Function-Specific</text>
  <rect x="895" y="408" width="105" height="18" rx="3" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="947" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd" style="white-space: pre;">Approved Tools</text>
  <rect x="530" y="445" width="495.595" height="120" rx="6" fill="rgba(255,255,255,0.03)" style=""/>
  <rect x="530" y="445" width="3" height="120" fill="#64c9cf"/>
  <text x="552" y="466" font-family="monospace" font-size="10" fill="#64c9cf" letter-spacing="2" style="white-space: pre;">LAYER 3: INNERMOST</text>
  <text x="552" y="488" font-family="sans-serif" font-size="17" font-weight="700" fill="#f0f4f8" style="white-space: pre;">Individual Practitioner</text>
  <text x="552" y="508" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">The operator's environment, responsibilities, decision authority, and working</text>
  <text x="552" y="524" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">preferences. Derived from role frameworks where they exist. Where they don't,</text>
  <text x="552" y="540" font-family="sans-serif" font-size="12" fill="#8a9bb0" style="white-space: pre;">bootstrapped through structured initialization questions at deployment time.</text>
  <rect x="552" y="548" width="80" height="18" rx="3" fill="rgba(100,201,207,0.1)" stroke="rgba(100,201,207,0.25)" stroke-width="1"/>
  <text x="592" y="560" text-anchor="middle" font-family="monospace" font-size="9" fill="#64c9cf" style="white-space: pre;">Role-Based</text>
  <rect x="638" y="548" width="105" height="18" rx="3" fill="rgba(100,201,207,0.1)" stroke="rgba(100,201,207,0.25)" stroke-width="1"/>
  <text x="690" y="560" text-anchor="middle" font-family="monospace" font-size="9" fill="#64c9cf" style="white-space: pre;">Structured Init</text>
  <rect x="749" y="548" width="100" height="18" rx="3" fill="rgba(100,201,207,0.1)" stroke="rgba(100,201,207,0.25)" stroke-width="1"/>
  <text x="799" y="560" text-anchor="middle" font-family="monospace" font-size="9" fill="#64c9cf" style="white-space: pre;">Runbook Layer</text>
  <rect x="855" y="548" width="100" height="18" rx="3" fill="rgba(100,201,207,0.1)" stroke="rgba(100,201,207,0.25)" stroke-width="1"/>
  <text x="905" y="560" text-anchor="middle" font-family="monospace" font-size="9" fill="#64c9cf" style="white-space: pre;">Least Privilege</text>
  <line x1="48" y1="640" x2="1033.08" y2="640" stroke="rgba(255,255,255,0.07)" stroke-width="1" style=""/>
  <g transform="matrix(1, 0, 0, 1, -12.166339, -1.849719)">
    <text x="68" y="678" font-family="monospace" font-size="15" font-weight="600" fill="#3b82f6" style="white-space: pre;">01</text>
    <text x="96" y="678" font-family="monospace" font-size="10" fill="#64c9cf" letter-spacing="2" style="white-space: pre;">GOVERNANCE MODEL</text>
    <text x="96" y="698" font-family="sans-serif" font-size="12" font-weight="600" fill="#c9d6e3" style="white-space: pre;">Policy, Procedure, Runbook.</text>
    <text x="96" y="714" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">The same layered structure regulated industries have</text>
    <text x="96" y="730" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">used for decades. Each layer narrows scope. Nobody</text>
    <text x="96" y="746" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">hands an employee the corporate ethics charter and asks</text>
    <text x="96" y="762" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">them to derive their daily constraints from first principles.</text>
  </g>
  <g transform="matrix(1, 0, 0, 1, -127.999996, -1.715142)">
    <text x="828" y="678" font-family="monospace" font-size="15" font-weight="600" fill="#64c9cf" style="white-space: pre;">03</text>
    <text x="856" y="678" font-family="monospace" font-size="10" fill="#64c9cf" letter-spacing="2" style="white-space: pre;">IDENTITY MODEL</text>
    <text x="856" y="698" font-family="sans-serif" font-size="12" font-weight="600" fill="#c9d6e3" style="white-space: pre;">Onboard it like an employee. Govern it like a vendor.</text>
    <text x="856" y="714" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">Each agent instance starts with only the context it</text>
    <text x="856" y="730" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">needs to produce safe, accurate, role-appropriate</text>
    <text x="856" y="746" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">results. Least privilege applied to reasoning,</text>
    <text x="856" y="762" font-family="sans-serif" font-size="11" fill="#8a9bb0" style="white-space: pre;">not just access.</text>
  </g>
</svg>